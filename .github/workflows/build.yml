name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build single-file executable
      run: python build.py

    - name: Package macOS app
      if: runner.os == 'macOS'
      run: |
        cd dist
        ditto -c -k --keepParent "Network Test Tool.app" NetworkTestTool-macos.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NetworkTestTool-${{ runner.os }}
        path: |
          dist/NetworkTestTool-*
          !dist/*.app

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    # Stable names make https://github.com/droltr/Network_Test_Tool/releases/latest/download/<name>
    # work without knowing the version. SHA256SUMS.txt lets the site/run.ps1 and site/run.sh
    # launchers verify every download.
    - name: Add stable-named copies and SHA256SUMS.txt
      working-directory: dist
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        for platform in windows-x86_64.exe linux-x86_64 macos-arm64; do
          matches=(NetworkTestTool-*-"$platform")
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one NetworkTestTool-*-$platform, found: ${matches[*]:-none}" >&2
            exit 1
          fi
          cp -p "${matches[0]}" "NetworkTestTool-$platform"
        done
        sha256sum NetworkTestTool-* > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
